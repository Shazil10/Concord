<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concord</title>
    <style>body{margin:0}</style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Local preview only. Ninoo gets App.tsx directly. -->
    <script type="module">
      const src = await (await fetch("./App.tsx")).text();
      const { code } = Babel.transform(src, {
        filename: "App.tsx",
        presets: ["typescript", ["react", { runtime: "automatic" }]],
      });
      const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      const { default: Concord } = await import(url);
      const React = (await import("react")).default;
      const { createRoot } = await import("react-dom/client");
      createRoot(document.getElementById("root")).render(React.createElement(Concord));
    </script>
  </body>
</html>
